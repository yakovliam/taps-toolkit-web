openapi: 3.0.0
#servers:
# Added by API Auto Mocking Plugin
#  - description: SwaggerHub API Auto Mocking
#    url: https://virtserver.swaggerhub.com/JACOB_24/TAPS_TOOLKIT/1.0.0
info:
  version: "1.0.0"
  title: TAPS Toolkit
  description: >-
    This is a TAPS Toolkit contract implementation
paths:
  /identities:
    get:
      summary: List all identities
      operationId: listIdentities
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: A list of identities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Identity'
  /identities/{uid}:
    get:
      summary: Get an identity by UID
      operationId: getIdentity
      security:
        - bearerAuth: [ ]
      parameters:
        - name: uid
          in: path
          required: true
          description: The UID of the identity to retrieve
          schema:
            type: string
      responses:
        '200':
          description: The identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
  /identities/{uid}/calculate-elo:
    get:
      summary: Calculate the ELO of an identity
      operationId: calculateElo
      security:
        - bearerAuth: [ ]
      parameters:
        - name: uid
          in: path
          required: true
          description: The UID of the identity to calculate the ELO for
          schema:
            type: string
      responses:
        '200':
          description: The ELO of the identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Elo'
  /identities/start-import-session:
    post:
      summary: Start an identity import session
      operationId: startImportSession
      security:
        - bearerAuth: [ ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityStartImportSessionRequest'
      responses:
        '200':
          description: The import session response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityStartImportSessionResponse'
  /identities/complete-import-session:
    post:
      summary: Complete an identity import session
      operationId: completeImportSession
      security:
        - bearerAuth: [ ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityCompleteImportSessionRequest'
      responses:
        '200':
          description: The import session response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityCompleteImportSessionResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Identity:
      type: object
      required:
        - uid
        - deviceUid
        - isBanned
        - isDeleted
        - usdBalance
        - gemsBalance
      properties:
        uid:
          type: string
        deviceUid:
          type: string
        isBanned:
          type: boolean
        isDeleted:
          type: boolean
        usdBalance:
          type: integer
          format: int64
        gemsBalance:
          type: integer
          format: int64
    Elo:
      required:
        - elo
      properties:
        elo:
          type: number
          format: double
    IdentityStartImportSessionRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
    IdentityStartImportSessionResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
        message:
          type: string
    IdentityCompleteImportSessionRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
    IdentityCompleteImportSessionResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
        message:
          type: string